[project]
name = "CalibreFanFicManagement"
version = "0.1"
description = "A tool to automatically download fics from AO3"
authors = [{name = "Rae Knowler"}]
requires-python = ">=3.14"
classifiers = []
dependencies = [
    "ao3@git+https://github.com/bellisk/ao3.git@v2.1.0",
    "calibre-helpers@git+https://github.com/bellisk/CalibreHelpers.git@0.1.0",
    "Brotli==1.2.0",
    "FanFicFare==4.59.0",
    "beautifulsoup4==4.13.4",
    "browser-cookie3==0.20.1",
    "certifi==2026.6.17",
    "chardet==4.0.0",
    "charset-normalizer==3.3.2",
    "FanFicFare==4.59.0",
    "html2text==2020.1.16",
    "html5lib==1.1",
    "idna==3.15",
    "jeepney==0.8.0",
    "lz4==4.3.3",
    "pillow==12.2.0",
    "pycryptodomex==3.20.0",
    "pyparsing==3.2.3",
    "requests-file==2.0.0",
    "requests-toolbelt==1.0.0",
    "requests==2.33.0",
    "six==1.17.0",
    "soupsieve==2.8.4",
    "urllib3==2.7.0",
    "webencodings==0.5.1",
]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["black", "flake8", "isort", "pytest", "pytest-cov"]

[tool.isort]
profile = "black"
sections = "FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER"
known_first_party = "ao3, calibre"

[tool.black]
line-length = 88
target-version = ["py314"]
