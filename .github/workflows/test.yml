name: Tests
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get token from Github App
        uses: actions/create-github-app-token@v1
        id: app_token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PEM }}
          # owner is required, otherwise the creds will fail the checkout step
          owner: ${{ github.repository_owner }}
      - name: Checkout from GitHub
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ steps.app_token.outputs.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install requirements
        run: pip install .[dev]
      - name: Check syntax and complexity
        run: |
          flake8 . --count --select=C901,E901,E999,F401,F821,F822,F823 --show-source --statistics
      - name: Check codestyle
        run: |
          isort --diff --check src/
          black --diff --check src/

  tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install requirements
        run: |
          pip install .[dev]
      - name: Run tests
        run: |
          pytest --cov=src tests/
